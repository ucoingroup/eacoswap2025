<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>EACOswap - Offline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: {{theme_bg}};
            color: {{theme_text}};
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            text-align: center;
        }

        .container {
            max-width: 400px;
            width: 100%;
        }

        .logo {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 8px;
            color: {{theme_accent}};
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 14px;
            color: {{theme_text}};
            opacity: 0.6;
            margin-bottom: 48px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .offline-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 32px;
            background: {{theme_accent}};
            opacity: 0.1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: {{theme_text}};
        }

        .message {
            font-size: 16px;
            color: {{theme_text}};
            opacity: 0.7;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .retry-btn {
            display: inline-block;
            padding: 14px 48px;
            background: {{theme_accent}};
            color: {{theme_bg}};
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s ease, opacity 0.2s ease;
            margin-bottom: 24px;
        }

        .retry-btn:hover, .retry-btn:active {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .status-link {
            font-size: 14px;
            color: {{theme_accent}};
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .status-link:hover {
            opacity: 1;
            text-decoration: underline;
        }

        .dots {
            display: inline-flex;
            gap: 4px;
            margin-left: 8px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: {{theme_accent}};
            border-radius: 50%;
            animation: pulse 1.4s ease-in-out infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .footer {
            position: fixed;
            bottom: 24px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
            color: {{theme_text}};
            opacity: 0.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">EACOswap</div>
        <div class="subtitle">Decentralized Exchange</div>

        <div class="offline-icon">📡</div>

        <h1 class="title">You're Offline</h1>
        <p class="message">
            Unable to connect to the EACOswap server.<br>
            Please check your internet connection and try again.
        </p>

        <button class="retry-btn" onclick="retryConnection()">
            Retry Connection
        </button>

        <div>
            <a href="https://status.eacoswap.com" class="status-link" target="_blank" rel="noopener noreferrer">
                Check server status →
            </a>
        </div>
    </div>

    <div class="footer">
        EACOswap iOS App © 2026
    </div>

    <script>
        function retryConnection() {
            const btn = document.querySelector('.retry-btn');
            btn.innerHTML = 'Retrying<span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>';
            btn.style.opacity = '0.7';
            btn.disabled = true;

            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.eacoswapBridge) {
                window.webkit.messageHandlers.eacoswapBridge.postMessage({
                    action: 'retryConnection'
                });
            }

            setTimeout(function() {
                if (window.location.reload) {
                    window.location.reload();
                }
            }, 1500);
        }

        function checkOnline() {
            if (navigator.onLine) {
                window.location.reload();
            }
        }

        window.addEventListener('online', function() {
            window.location.reload();
        });

        setInterval(checkOnline, 5000);
    </script>
</body>
</html>
