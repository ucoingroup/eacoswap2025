<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>No Connection - EACOswap</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #14233a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #64ffda;
        }
        p {
            font-size: 16px;
            color: #a0b3d6;
            margin-bottom: 32px;
            line-height: 1.5;
        }
        .retry-btn {
            background: #64ffda;
            color: #0a1628;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(100, 255, 218, 0.3);
        }
        .retry-btn:active {
            transform: translateY(0);
        }
        .server-info {
            margin-top: 24px;
            font-size: 12px;
            color: #5a6d8a;
        }
    </style>
</head>
<body>
    <div class="icon">📡</div>
    <h1>No Connection</h1>
    <p>Unable to reach the EACOswap server.<br>Please check your internet connection and try again.</p>
    <button class="retry-btn" onclick="retryConnection()">Retry</button>
    <div class="server-info" id="server-info"></div>

    <script>
        function retryConnection() {
            if (window.AndroidBridge && typeof window.AndroidBridge.showToast === 'function') {
                window.AndroidBridge.showToast('Retrying connection...');
            }
            // Attempt to reload the main page
            if (window.location.href !== 'about:blank') {
                window.location.reload();
            } else {
                // Notify Android to reload
                if (window.AndroidBridge && typeof window.AndroidBridge.getTheme === 'function') {
                    // Bridge is available, app will handle reload
                }
            }
        }

        // Display server URL if available from Android
        document.addEventListener('DOMContentLoaded', function() {
            var info = document.getElementById('server-info');
            info.textContent = 'Server: ' + (window.location.hostname || 'localhost:3000');
        });
    </script>
</body>
</html>
